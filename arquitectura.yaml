# --- SERVICIO PAGOS ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagos-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagos
  template:
    metadata:
      labels:
        app: pagos
    spec:
      containers:
      - name: pagos
        image: app-pagos:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: pagos-svc
spec:
  selector:
    app: pagos
  ports:
  - port: 80
    targetPort: 3000
---
# --- SERVICIO RESERVAS (Distribuido) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reservas
  template:
    metadata:
      labels:
        app: reservas
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - reservas
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: reservas
        image: app-reservas:v6
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: PAGOS_URL
          value: "http://pagos-svc:80"
---
apiVersion: v1
kind: Service
metadata:
  name: reservas-svc
spec:
  selector:
    app: reservas
  ports:
  - port: 80
    targetPort: 3000
---
